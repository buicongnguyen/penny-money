name: Test and deploy Penny
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run transaction, timestamp, backup and insight tests
        run: node --test tests/*.test.mjs
      - name: Check browser JavaScript syntax
        run: |
          for file in dist/*.mjs dist/*.js; do node --check "$file"; done
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    if: ${{ vars.PAGES_ENABLED == 'true' }}
    needs: test-and-package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
